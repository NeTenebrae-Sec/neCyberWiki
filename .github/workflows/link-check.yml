name: Check links

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          # Los artefactos generados no son Markdown de origen y Youtube bloquea a los checkers con 403.
          args: --no-progress --exclude-path dist --exclude-path public/pagefind --exclude 'youtube\.com' './**/*.md'
          fail: true
