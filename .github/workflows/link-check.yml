name: Check links

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      # El sitio se publica bajo /neCyberWiki/ pero dist/ no tiene ese prefijo.
      # Un symlink mapea el base path a la raíz del build para que lychee
      # resuelva /neCyberWiki/cursos/... contra dist/cursos/...
      - name: Map Pages base path
        run: ln -s . dist/neCyberWiki
      - name: Check links in the built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --index-files index.html
            --exclude 'youtube\.com'
            'dist/**/*.html'
          fail: true
