name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (producción)
        uses: actions/checkout@v7
        with:
          ref: main
          path: site-main
          persist-credentials: false

      - name: Checkout dev (staging)
        uses: actions/checkout@v7
        with:
          ref: dev
          path: site-dev
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-main/package-lock.json

      - name: Install dependencies (main)
        working-directory: site-main
        run: npm ci

      - name: Build main
        working-directory: site-main
        run: npm run build

      - name: Install dependencies (dev)
        working-directory: site-dev
        run: npm ci

      - name: Build dev (staging)
        working-directory: site-dev
        env:
          PUBLIC_NCW_BASE: /neCyberWiki/dev/
        run: npm run build

      - name: Assemble site (main at /, dev at /dev/)
        run: |
          mkdir -p _site/dev
          cp -r site-main/dist/. _site/
          cp -r site-dev/dist/. _site/dev/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
